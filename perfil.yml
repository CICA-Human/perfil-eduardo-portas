# Tu semblanza. Separa los párrafos con una línea en blanco.
# Usa *asteriscos* para poner títulos de obras en cursivas.
bio: |
  Doctor en Comunicación y Mercadotecnia Estratégica por la Universidad Anáhuac México, donde es profesor investigador del Centro de Investigación para la Comunicación Aplicada (CICA) y miembro del Human & Nonhuman Communication Lab.

  Estudia la cultura digital juvenil: cómo plataformas como TikTok y YouTube, y herramientas de inteligencia artificial, cambian los hábitos, la atención y las formas de aprender de las nuevas generaciones, y qué retos plantean para la universidad.

  Antes de dedicarse a la academia fue periodista. Trabajó como reportero, editor y coordinador web en el diario *Reforma*, fue editor en jefe del portal EjeCentral y reportero sénior de ADNPolítico (CNN Expansión), y ha colaborado con *El País*. Es licenciado en Comunicación por la Universidad Iberoamericana, maestro en Periodismo por la Universitat de Barcelona (IL3), en un programa conjunto con Columbia University, y maestro en Historia Moderna de México por Casa Lamm.

